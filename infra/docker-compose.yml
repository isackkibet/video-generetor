name: yohpal-live-ai-content-factory

services:
  postgres:
    image: postgres:16-alpine
    container_name: yohpal_live_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yohpal_live_ai
    ports:
      - "5432:5432"
    volumes:
      - yohpal_postgres_data:/var/lib/postgresql/data
    networks:
      - yohpal_live_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yohpal_live_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yohpal_live_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - yohpal_live_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: yohpal_live_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - yohpal_live_net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: yohpal_live_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - yohpal_live_net
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: yohpal_live_zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://yohpal_live_kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  api-gateway:
    build:
      context: ..
      dockerfile: backend/api-gateway/Dockerfile
    container_name: yohpal_live_api_gateway
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: yohpal_live_kafka:9092
      TREND_SERVICE_URL: http://trend-service:3001
      SCRIPT_SERVICE_URL: http://script-service:3002
      RENDER_SERVICE_URL: http://render-service:3003
      MODERATION_SERVICE_URL: http://moderation-service:3004
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:3005
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      trend-service:
        condition: service_started
      script-service:
        condition: service_started
      render-service:
        condition: service_started
      moderation-service:
        condition: service_started
      recommendation-service:
        condition: service_started
    networks:
      - yohpal_live_net

  trend-service:
    build:
      context: ..
      dockerfile: backend/trend-service/Dockerfile
    container_name: yohpal_live_trend_service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: yohpal_live_kafka:9092
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - yohpal_live_net

  script-service:
    build:
      context: ..
      dockerfile: backend/script-service/Dockerfile
    container_name: yohpal_live_script_service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: yohpal_live_kafka:9092
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - yohpal_live_net

  render-service:
    build:
      context: ..
      dockerfile: backend/render-service/Dockerfile
    container_name: yohpal_live_render_service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: yohpal_live_kafka:9092
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - yohpal_live_net

  moderation-service:
    build:
      context: ..
      dockerfile: backend/moderation-service/Dockerfile
    container_name: yohpal_live_moderation_service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: yohpal_live_kafka:9092
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - yohpal_live_net

  recommendation-service:
    build:
      context: ..
      dockerfile: backend/recommendation-service/Dockerfile
    container_name: yohpal_live_recommendation_service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BROKERS: yohpal_live_kafka:9092
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - yohpal_live_net

  nginx:
    image: nginx:1.27-alpine
    container_name: yohpal_live_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - yohpal_live_net

volumes:
  yohpal_postgres_data:

networks:
  yohpal_live_net:
    driver: bridge
