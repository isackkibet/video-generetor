apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: yohpal-live
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: registry.yohpal.com/yohpal-live/api-gateway:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: yohpal-live-config
        - secretRef:
            name: yohpal-live-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: yohpal-live
spec:
  selector:
    app: api-gateway
  ports:
  - port: 3000
    targetPort: 3000
