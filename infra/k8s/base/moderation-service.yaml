apiVersion: apps/v1
kind: Deployment
metadata:
  name: moderation-service
  namespace: yohpal-live
spec:
  replicas: 3
  selector:
    matchLabels:
      app: moderation-service
  template:
    metadata:
      labels:
        app: moderation-service
    spec:
      containers:
      - name: moderation-service
        image: registry.yohpal.com/yohpal-live/moderation-service:latest
        ports:
        - containerPort: 3004
        envFrom:
        - configMapRef:
            name: yohpal-live-config
        - secretRef:
            name: yohpal-live-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: moderation-service
  namespace: yohpal-live
spec:
  selector:
    app: moderation-service
  ports:
  - port: 3004
    targetPort: 3004
