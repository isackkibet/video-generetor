apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: render-service-hpa
  namespace: yohpal-live
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: render-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
