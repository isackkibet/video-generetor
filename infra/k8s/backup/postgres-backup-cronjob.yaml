apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: yohpal-live
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: postgres-backup
              image: postgres:16-alpine
              envFrom:
                - secretRef:
                    name: yohpal-live-secrets
              env:
                - name: BACKUP_BUCKET
                  value: "s3://yohpal-live-prod-backups/postgres"
              command:
                - /bin/sh
                - -c
                - |
                  apk add --no-cache aws-cli
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  FILE=/tmp/yohpal_live_${TIMESTAMP}.sql
                  pg_dump "$DATABASE_URL" > "$FILE"
                  aws s3 cp "$FILE" "$BACKUP_BUCKET/yohpal_live_${TIMESTAMP}.sql"
                  echo "Backup uploaded: $BACKUP_BUCKET/yohpal_live_${TIMESTAMP}.sql"