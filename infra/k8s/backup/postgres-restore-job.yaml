apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-restore
  namespace: yohpal-live
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: postgres-restore
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: yohpal-live-secrets
          env:
            - name: RESTORE_FILE_URL
              value: "REPLACE_WITH_BACKUP_FILE_URL"
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache aws-cli
              aws s3 cp "$RESTORE_FILE_URL" /tmp/restore.sql
              psql "$DATABASE_URL" < /tmp/restore.sql
              echo "Restore completed from $RESTORE_FILE_URL"