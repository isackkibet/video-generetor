name: YohPal Live Blueprint Alignment CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yohpal_live_ai
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yohpal_live_ai
      REDIS_URL: redis://localhost:6379
      KAFKA_BROKERS: localhost:9092
      ADMIN_JWT_SECRET: test-secret
      API_GATEWAY_KEY: test-api-key
      SERVICE_AUTH_KEY: test-service-key
      ENABLE_KAFKA_WORKERS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:e2e
      - name: Run production readiness regression tests
        run: npm run test:production-readiness
      - name: Generate CI evidence
        run: npm run ci:evidence
      - name: Upload CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: yohpal-live-ci-evidence
          path: evidence/ci-evidence.json

      - name: Generate Blueprint Alignment Report
        run: npm run certification:blueprint

      - name: Enforce 90 Percent Blueprint Alignment Gate
        run: npm run certification:enforce

      - name: Upload Blueprint Certification Evidence
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-alignment-certification
          path: |
            evidence/blueprint-alignment-report.json
            evidence/blueprint-alignment-report.md
